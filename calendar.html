        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>

<main class="calendar-page">
<span class="kicker">Tasks by day</span>
<h1>Calendar</h1>
<p>Tasks with a due date from <a href="todo.html">the shared to-do list</a>, laid out by day. This page always shows today's real date — reload it on any day and it re-centres itself. Add or change due dates on the <a href="todo.html">To-do page</a>.</p>

<section class="today-panel" aria-label="Today">
  <h2 id="today-heading"></h2>
  <div id="overdue-list"></div>
  <div id="today-list"></div>
</section>

<section class="calendar-section" aria-label="Month view">
  <div class="calendar-toolbar">
    <button class="btn btn-secondary" id="cal-prev" aria-label="Previous month">&larr;</button>
    <h2 id="cal-month-label"></h2>
    <button class="btn btn-secondary" id="cal-next" aria-label="Next month">&rarr;</button>
    <button class="btn btn-secondary" id="cal-today">Today</button>
  </div>
  <div class="calendar-grid" id="calendar-grid" role="grid" aria-label="Month grid"></div>
  <p id="cal-notice" role="status" aria-live="polite"></p>
</section>
</main>
<script src="js/calendar.js"></script>
</body></html>
